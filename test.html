<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpine Weather · Test</title>
<style>
body{margin:0;background:#07101d;color:#f4f7fb;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto;padding:24px 16px 40px}h1{margin:0 0 6px}.muted{color:#91a2b8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.card{background:#0e1a2b;border:1px solid #263850;border-radius:14px;padding:14px}.ok{border-color:#315b48}.warn{border-color:#68572d}.bad{border-color:#6b4036}.status{font-weight:700}.detail{font-size:12px;color:#91a2b8;margin-top:6px;word-break:break-word}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #315c83;background:#132238;color:#f4f7fb;border-radius:10px;padding:10px 13px;text-decoration:none;cursor:pointer}.summary{margin-top:14px;padding:12px;border-radius:12px;background:#142438;border:1px solid #28435f}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px} @media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap">
<h1>Alpine Weather — Test diagnostico</h1><div class="muted">Controllo rapido del backend e delle API usate dalla versione V45.</div>
<div class="actions"><button class="btn" id="run">Esegui tutti i test</button><a class="btn" href="/">Apri Alpine Weather</a></div>
<div id="summary" class="summary">Premi “Esegui tutti i test”.</div><section id="tests" class="grid"></section>
<script>
const tests=document.getElementById('tests'),summary=document.getElementById('summary');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function check(name,fn){const el=document.createElement('article');el.className='card';el.innerHTML='<div>'+esc(name)+'</div><div class="status">⏳ In corso…</div><div class="detail"></div>';tests.appendChild(el);const st=el.querySelector('.status'),d=el.querySelector('.detail');try{const r=await fn();el.classList.add(r.warn?'warn':'ok');st.textContent=r.warn?'⚠ '+r.status:'✓ '+r.status;d.textContent=r.detail||'';return !r.warn}catch(e){el.classList.add('bad');st.textContent='✗ ERRORE';d.textContent=e.message||String(e);return false}}
async function json(path){const r=await fetch(path,{cache:'no-store'});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error('HTTP '+r.status+(data?.error?': '+data.error:''));return data}
async function run(){tests.innerHTML='';summary.textContent='Test in esecuzione…';const results=[];
results.push(await check('Server /health',async()=>{const d=await json('/health');return {status:d.ok?'ONLINE':'RISPOSTA ANOMALA',detail:'Servizio: '+d.service+' · DB osservazioni: '+d.database.observations+' · Meteostat: '+(d.meteostatConfigured?'configurato':'non configurato')}}));
results.push(await check('Frontend index.html',async()=>{const r=await fetch('/index.html',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return {status:t.includes('ALPINE WEATHER')?'PRESENTE':'CONTENUTO INATTESO',detail:t.length+' caratteri'}}));
results.push(await check('Open-Meteo /weather',async()=>{const d=await json('/weather?lat=45.9237&lon=7.8357&elevation=3480');return {status:'DATI RICEVUTI',detail:'Temperatura: '+(d.hourly?.temperature_2m?.[0]??'—')+' °C · ore: '+(d.hourly?.time?.length??0)}}));
results.push(await check('Modelli ECMWF / GFS / ICON',async()=>{const d=await json('/models?lat=45.9237&lon=7.8357');const names=['ECMWF','GFS','ICON'];const good=names.filter(n=>d.models?.[n]&&!d.models[n].error);const bad=names.filter(n=>d.models?.[n]?.error);return {warn:good.length!==3,status:good.length+'/3 modelli disponibili',detail:(bad.length?'Errore: '+bad.map(n=>n+': '+d.models[n].error).join(' | '):'Tutti i modelli hanno risposto')}}));
results.push(await check('RainViewer /radar',async()=>{const d=await json('/radar');const n=d?.radar?.past?.length||0;return {warn:n===0,status:n+' frame radar',detail:d.host?'Host radar disponibile':'Metadati incompleti'}}));
results.push(await check('Database /db/summary',async()=>{const d=await json('/db/summary');return {status:'DATABASE OK',detail:'Versione '+d.version+' · osservazioni '+d.observations+' · forecast '+d.forecasts}}));
results.push(await check('Radar segmentation module',async()=>{const r=await fetch('/radar-segmentation.js',{cache:'no-store'});return {warn:!r.ok,status:r.ok?'FILE PRESENTE':'FILE NON RAGGIUNGIBILE',detail:'HTTP '+r.status}}));
const good=results.filter(Boolean).length;summary.innerHTML='<b>'+good+'/'+results.length+' controlli superati.</b> '+(good===results.length?'La versione di test risulta operativa.':'Sono presenti controlli da verificare.');}
document.getElementById('run').addEventListener('click',run);run();
</script></main></body></html>
